<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cardápio Online</title>
  <meta name="description" content="Faça seu pedido online e receba direto pelo WhatsApp." />
  <meta name="theme-color" content="#0e1117" />

  <!-- Open Graph -->
  <meta property="og:title" content="Cardápio Online" />
  <meta property="og:description" content="Monte seu pedido e envie direto no WhatsApp!" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/cardapio.css" />

  <style>
    .loading-screen {
      position: fixed; inset: 0; background: var(--bg-primary);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; gap: 1rem;
    }
    .loading-screen.hidden { display: none; }
    .loading-spinner { width: 48px; height: 48px; border: 4px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .store-closed { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
    .store-closed h1 { color: var(--status-closed); margin-bottom: 1rem; }
    .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%) translateY(100px); padding: 1rem 1.5rem; border-radius: var(--radius-md); background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow-lg); z-index: 9999; opacity: 0; transition: all 0.3s ease; }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.success { border-color: var(--status-open); }
    .toast.error { border-color: var(--status-closed); }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <p style="color: var(--text-secondary);">Carregando cardápio...</p>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- Cabeçalho da Loja -->
  <div id="headerContainer"></div>

  <!-- Navegação de Categorias -->
  <div id="navContainer"></div>

  <!-- Conteúdo Principal -->
  <main class="container">
    <div id="menuContainer" class="menu-sections"></div>
  </main>

  <!-- Rodapé -->
  <footer style="padding: 2rem 1rem 7rem; text-align: center; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted);">
    <div class="container">
      <p style="margin-bottom: 0.5rem;"><span id="footerStoreName">Pizzaria</span> • Todos os direitos reservados</p>
      <p>Pedido direto via WhatsApp.</p>
    </div>
  </footer>

  <!-- Floating Cart Bar -->
  <div id="floatingCartBar" class="floating-cart-bar"></div>

  <!-- Modals -->
  <div id="productModalBackdrop" class="modal-backdrop">
    <div id="productModalContent" class="modal-sheet"></div>
  </div>
  <div id="cartDrawerBackdrop" class="modal-backdrop">
    <div id="cartDrawerContent" class="modal-sheet"></div>
  </div>
  <div id="checkoutModalBackdrop" class="modal-backdrop">
    <div id="checkoutModalContent" class="modal-sheet"></div>
  </div>
  <div id="successModalBackdrop" class="modal-backdrop">
    <div id="successModalContent" class="modal-sheet"></div>
  </div>

  <!-- Dados mock para fallback de addons -->
  <script src="js/mock/initialData.js"></script>
  <!-- Estado e Componentes (ordem importa) -->
  <script src="js/state/store.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/categoryList.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/productModal.js"></script>
  <script src="js/components/cartDrawer.js"></script>
  <script src="js/components/checkoutModal.js"></script>
  <script src="js/services/customer.js"></script>
  <script src="js/services/order.js"></script>

  <!-- Supabase globals -->
  <script type="module">
    import { supabase, menuApi, ordersApi, storageApi } from './js/lib/supabase.js?v=6';
    import { storage } from './js/state/storage-supabase.js?v=6';
    // Expose globals for components
    window.supabase = supabase;
    window.menuApi = menuApi;
    window.ordersApi = ordersApi;
    window.storageApi = storageApi;
    window.storage = storage;
  </script>
  <script src="js/app-supabase.js?v=6"></script>
</body>
</html>
