<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pizzaria Bella Massa — Cardápio Online</title>
  <meta name="description" content="Faça seu pedido online de pizzas artesanais e receba direto pelo WhatsApp com rapidez e comodidade." />
  <meta name="theme-color" content="#0e1117" />

  <!-- Open Graph para compartilhamento no WhatsApp -->
  <meta property="og:title" content="Pizzaria Bella Massa — Cardápio Online" />
  <meta property="og:description" content="Pizzas artesanais no forno a lenha. Monte seu pedido e envie direto no WhatsApp!" />
  <meta property="og:type" content="website" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/cardapio.css" />
</head>
<body>

  <!-- Cabeçalho da Loja e Reconhecimento do Cliente -->
  <div id="headerContainer"></div>

  <!-- Barra Fixa de Categorias e Busca -->
  <div id="navContainer"></div>

  <!-- Conteúdo Principal do Cardápio -->
  <main class="container">
    <div id="menuContainer" class="menu-sections"></div>
  </main>

  <!-- Rodapé com Link para Painel do Lojista -->
  <footer style="padding: 2rem 1rem 7rem; text-align: center; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--text-muted);">
    <div class="container">
      <p style="margin-bottom: 0.5rem;">🍕 <strong>Pizzaria Bella Massa</strong> • Todos os direitos reservados</p>
      <p>Desenvolvido com tecnologia de pedido direto via WhatsApp.</p>
      <div style="margin-top: 1rem;">
        <a href="admin.html" class="btn btn-secondary btn-sm" style="display: inline-flex; align-items: center; gap: 0.4rem;">
          ⚙️ Painel da Pizzaria (Lojista)
        </a>
      </div>
    </div>
  </footer>

  <!-- Barra Flutuante da Sacola -->
  <div id="floatingCartBar" class="floating-cart-bar"></div>

  <!-- Modal de Personalização do Produto -->
  <div id="productModalBackdrop" class="modal-backdrop">
    <div id="productModalContent" class="modal-sheet"></div>
  </div>

  <!-- Gaveta do Carrinho / Sacola (Cart Drawer) -->
  <div id="cartDrawerBackdrop" class="modal-backdrop">
    <div id="cartDrawerContent" class="modal-sheet"></div>
  </div>

  <!-- Modal de Identificação e Entrega (Checkout) -->
  <div id="checkoutModalBackdrop" class="modal-backdrop">
    <div id="checkoutModalContent" class="modal-sheet"></div>
  </div>

  <!-- Modal de Sucesso / Confirmação do WhatsApp (Pós-Pedido) -->
  <div id="successModalBackdrop" class="modal-backdrop">
    <div id="successModalContent" class="modal-sheet"></div>
  </div>

  <!-- Scripts Universais (Funcionam em file:// e em http://) -->
  <script src="js/mock/initialData.js"></script>
  <script src="js/state/storage.js"></script>
  <script src="js/state/store.js"></script>
  <script src="js/services/customer.js"></script>
  <script src="js/services/order.js"></script>
  <script src="js/services/whatsapp.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/categoryList.js"></script>
  <script src="js/components/productCard.js"></script>
  <script src="js/components/productModal.js"></script>
  <script src="js/components/cartDrawer.js"></script>
  <script src="js/components/checkoutModal.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
